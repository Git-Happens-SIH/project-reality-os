<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose an account — Nirmaan Setu</title>
  <link rel="preload" href="assets/circle-loader.svg" as="image" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="ns-loader.js" defer></script>
</head>
<body>
  <div class="flex min-h-screen items-center justify-center bg-neutral-50 px-6 py-14">
    <div class="w-full max-w-sm rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 grid h-10 w-10 place-items-center rounded-xl bg-neutral-900 text-white">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
            <path d="m12 3 9 9-9 9-9-9 9-9Z" />
            <path d="m12 7 5 5-5 5-5-5 5-5Z" />
          </svg>
        </div>
        <h1 class="text-lg font-semibold text-neutral-900">Choose an account</h1>
        <p class="mt-1 text-sm text-neutral-500">
          to continue to <span class="font-medium text-neutral-700">Nirmaan Setu</span>
        </p>
      </div>

      <div class="space-y-1">
        <a href="nirmaan-setu-dashboard.html" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-4 focus-visible:ring-neutral-900/10">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-neutral-900 text-sm font-medium text-white">RM</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-neutral-900">Rae Mensah</span>
            <span class="block truncate text-xs text-neutral-500">rae@meridian.infra</span>
          </span>
          <span class="rounded-full bg-green-100 px-2 py-0.5 text-[11px] font-medium text-green-700">Active</span>
        </a>

        <a href="nirmaan-setu-auth-otp.html" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-4 focus-visible:ring-neutral-900/10">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-amber-500 text-sm font-medium text-white">JP</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-neutral-900">Jules Park</span>
            <span class="block truncate text-xs text-neutral-500">jules.park@meridian.infra</span>
          </span>
          <span class="text-[11px] text-neutral-400">Signed out</span>
        </a>

        <a href="nirmaan-setu-auth-otp.html" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-4 focus-visible:ring-neutral-900/10">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-neutral-400 text-sm font-medium text-white">DK</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium text-neutral-900">Dana Køhler</span>
            <span class="block truncate text-xs text-neutral-500">dana@field.meridian</span>
          </span>
          <span class="text-[11px] text-neutral-400">Signed out</span>
        </a>
      </div>

      <a href="nirmaan-setu-auth-signup.html" class="mt-3 flex w-full items-center gap-3 rounded-xl border border-dashed border-neutral-300 px-3 py-3 text-left transition hover:border-neutral-400 hover:bg-neutral-50">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-neutral-200 text-neutral-500">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </span>
        <span class="text-sm font-medium text-neutral-700">Use another account</span>
      </a>

      <div class="mt-6 border-t border-neutral-200 pt-4 text-center">
        <a href="nirmaan-setu-auth-signup.html" class="text-xs font-medium text-neutral-500 underline-offset-4 hover:text-neutral-900 hover:underline">Sign out of all accounts</a>
        <p class="mt-3 text-[11px] leading-relaxed text-neutral-400">
          By continuing you agree to the <a href="#" class="underline">Terms</a> and <a href="#" class="underline">Privacy Policy</a>.
        </p>
      </div>
    </div>
  </div>
</body>
</html>

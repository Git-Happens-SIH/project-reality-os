<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nirmaan Setu — Logo</title>
  <style>
    :root {
      --orange: #FF8A00;
      --cream: #FCF9F0;
      --black: #171717;
      --muted: #4F4B45;
      --border: #1C1C1C;
      --charcoal: #262626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--cream);
      color: var(--black);
      padding: 40px 20px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .lede { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
    .label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .panel {
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 24px;
      margin-bottom: 16px;
      background: var(--cream);
    }
    .panel.dark { background: var(--charcoal); }
    .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .sizes { display: flex; align-items: flex-end; gap: 16px; }
    .sizes img, .sizes svg { display: block; }
    .lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--black);
      text-decoration: none;
    }
    .lockup.invert { color: var(--cream); }
    .lockup span { color: var(--orange); }
    .note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Logo system</h1>
    <p class="lede">Plan layer meets site layer. Orange lock = live project truth. Matches design.md §2.9.</p>

    <p class="label">Mark — sizes</p>
    <div class="panel">
      <div class="sizes">
        <img src="assets/logo-mark.svg" width="64" height="64" alt="64px" />
        <img src="assets/logo-mark.svg" width="40" height="40" alt="40px" />
        <img src="assets/logo-mark.svg" width="22" height="22" alt="22px nav" />
        <img src="assets/logo-mark.svg" width="16" height="16" alt="16px favicon" />
      </div>
      <p class="note">64 · 40 · 22 (nav) · 16 (favicon)</p>
    </div>

    <p class="label">Nav lockup</p>
    <div class="panel">
      <a class="lockup" href="#">
        <img src="assets/logo-mark.svg" width="22" height="22" alt="" />
        Nirmaan<span> Setu</span>
      </a>
    </div>

    <p class="label">Dark surface</p>
    <div class="panel dark">
      <a class="lockup invert" href="#">
        <img src="assets/logo-mark-dark.svg" width="22" height="22" alt="" />
        Nirmaan<span> Setu</span>
      </a>
    </div>

    <p class="label">Full wordmark SVG</p>
    <div class="panel">
      <img src="assets/logo-wordmark.svg" width="180" height="32" alt="Nirmaan Setu" />
    </div>

    <p class="label">Raster preview</p>
    <div class="panel" style="padding: 0; overflow: hidden;">
      <img src="assets/nirmaan-setu-logo.png" width="100%" alt="Logo raster preview" style="display:block;" />
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Project Reality OS</title>
  <link rel="preload" href="assets/circle-loader.svg" as="image" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="pros-loader.js" defer></script>
</head>
<body>
  <div class="flex min-h-screen items-center justify-center bg-neutral-100 p-6">
    <div class="w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-8 shadow-sm">
      <h1 class="text-xl font-semibold text-neutral-900">Reset your password</h1>
      <p class="mt-1 text-sm text-neutral-500">
        for <span class="font-medium text-neutral-700">you@company.com</span>
      </p>

      <form id="reset-form" class="mt-6 space-y-4" action="project-reality-os-auth-chooser.html" method="get">
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-neutral-700">New password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
            class="w-full rounded-xl border border-neutral-200 px-3.5 py-2.5 text-sm outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
          />
          <div class="mt-3 flex gap-1.5" id="strength-meter" aria-hidden="true">
            <span class="seg h-1.5 flex-1 rounded-full bg-neutral-200 transition"></span>
            <span class="seg h-1.5 flex-1 rounded-full bg-neutral-200 transition"></span>
            <span class="seg h-1.5 flex-1 rounded-full bg-neutral-200 transition"></span>
            <span class="seg h-1.5 flex-1 rounded-full bg-neutral-200 transition"></span>
          </div>
          <p class="mt-1.5 text-xs text-neutral-400" id="strength-label">Strength</p>
        </div>

        <div>
          <label for="confirm" class="mb-1.5 block text-sm font-medium text-neutral-700">Confirm password</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            autocomplete="new-password"
            required
            class="w-full rounded-xl border border-neutral-200 px-3.5 py-2.5 text-sm outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
          />
        </div>

        <ul class="space-y-2" id="rules">
          <li data-rule="length" class="rule flex items-center gap-2 text-sm text-neutral-400">
            <span class="rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent">✓</span>
            At least 8 characters
          </li>
          <li data-rule="number" class="rule flex items-center gap-2 text-sm text-neutral-400">
            <span class="rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent">✓</span>
            Contains a number
          </li>
          <li data-rule="symbol" class="rule flex items-center gap-2 text-sm text-neutral-400">
            <span class="rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent">✓</span>
            Contains a symbol
          </li>
          <li data-rule="mixed" class="rule flex items-center gap-2 text-sm text-neutral-400">
            <span class="rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent">✓</span>
            Upper and lowercase letters
          </li>
          <li data-rule="match" class="rule flex items-center gap-2 text-sm text-neutral-400">
            <span class="rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent">✓</span>
            Passwords match
          </li>
        </ul>

        <button
          type="submit"
          id="submit-btn"
          disabled
          class="w-full rounded-xl bg-neutral-900 py-2.5 text-sm font-medium text-white transition hover:bg-neutral-800 disabled:cursor-not-allowed disabled:bg-neutral-300 disabled:hover:bg-neutral-300"
        >
          Update password
        </button>
      </form>

      <p class="mt-6 text-center">
        <a href="project-reality-os-auth-chooser.html" class="text-sm font-medium text-neutral-500 underline-offset-4 hover:text-neutral-900 hover:underline">Back to sign in</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      var password = document.getElementById('password');
      var confirm = document.getElementById('confirm');
      var segs = Array.prototype.slice.call(document.querySelectorAll('#strength-meter .seg'));
      var label = document.getElementById('strength-label');
      var submitBtn = document.getElementById('submit-btn');
      var rules = Array.prototype.slice.call(document.querySelectorAll('[data-rule]'));
      var labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

      function scorePassword(value) {
        var score = 0;
        if (value.length >= 8) score += 1;
        if (/\d/.test(value)) score += 1;
        if (/[^A-Za-z0-9]/.test(value)) score += 1;
        if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score += 1;
        return score;
      }

      function rulePass(name, value, confirmValue) {
        if (name === 'length') return value.length >= 8;
        if (name === 'number') return /\d/.test(value);
        if (name === 'symbol') return /[^A-Za-z0-9]/.test(value);
        if (name === 'mixed') return /[a-z]/.test(value) && /[A-Z]/.test(value);
        if (name === 'match') return value.length > 0 && value === confirmValue;
        return false;
      }

      function paintRule(el, ok) {
        var icon = el.querySelector('.rule-icon');
        if (ok) {
          el.classList.remove('text-neutral-400');
          el.classList.add('text-neutral-700');
          icon.className = 'rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-green-500 text-[10px] font-bold text-white';
        } else {
          el.classList.add('text-neutral-400');
          el.classList.remove('text-neutral-700');
          icon.className = 'rule-icon grid size-4 shrink-0 place-items-center rounded-full bg-neutral-200 text-[10px] text-transparent';
        }
      }

      function update() {
        var value = password.value;
        var confirmValue = confirm.value;
        var score = scorePassword(value);

        segs.forEach(function (seg, i) {
          seg.className = 'seg h-1.5 flex-1 rounded-full transition';
          if (i < score) {
            seg.classList.add(score >= 3 ? 'bg-green-500' : 'bg-amber-400');
          } else {
            seg.classList.add('bg-neutral-200');
          }
        });

        label.textContent = score === 0 ? 'Strength' : labels[score];
        label.className = 'mt-1.5 text-xs ' + (score >= 3 ? 'text-green-600' : score > 0 ? 'text-amber-600' : 'text-neutral-400');

        var allOk = true;
        rules.forEach(function (el) {
          var ok = rulePass(el.getAttribute('data-rule'), value, confirmValue);
          paintRule(el, ok);
          if (!ok) allOk = false;
        });

        submitBtn.disabled = !allOk;
      }

      password.addEventListener('input', update);
      confirm.addEventListener('input', update);

      document.getElementById('reset-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (submitBtn.disabled) return;
        window.location.href = 'project-reality-os-auth-chooser.html';
      });

      update();
    })();
  </script>
</body>
</html>

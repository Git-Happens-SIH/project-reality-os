<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose your role — Project Reality OS</title>
  <link rel="preload" href="assets/circle-loader.svg" as="image" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="pros-loader.js" defer></script>
</head>
<body>
  <div class="flex min-h-screen items-center justify-center bg-neutral-100 px-6 py-14">
    <div class="w-full max-w-3xl">
      <div class="text-center">
        <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 sm:text-3xl">
          What do you do?
        </h1>
        <p class="mt-2 text-sm text-neutral-500 sm:text-base">
          We’ll tailor your workspace to how you work on the project.
        </p>
      </div>

      <form id="role-form" class="mt-8" action="project-reality-os-auth-signup.html" method="get">
        <div class="grid gap-3 sm:grid-cols-3" role="radiogroup" aria-label="Your role">

          <label class="relative block cursor-pointer">
            <input type="radio" name="role" value="engineer" class="peer sr-only" />
            <div class="h-full rounded-2xl border border-neutral-200 bg-white p-4 pr-10 shadow-sm transition peer-checked:border-neutral-900 peer-checked:ring-4 peer-checked:ring-neutral-900/10 peer-focus-visible:ring-4 peer-focus-visible:ring-neutral-900/10 hover:border-neutral-300">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-neutral-100 text-neutral-700">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                  <path d="M14.7 6.3a4 4 0 0 0-5.4 0L4 11.6V20h8.4l5.3-5.3a4 4 0 0 0 0-5.4Z" />
                  <path d="m12 8 4 4" />
                  <path d="M4 16h4" />
                </svg>
              </span>
              <span class="mt-3 block text-sm font-semibold text-neutral-900">Site Engineer</span>
              <span class="mt-1 block text-xs leading-relaxed text-neutral-500">Write daily field reports and confirm AI matches.</span>
            </div>
            <span class="pointer-events-none absolute right-3 top-3 grid h-5 w-5 place-items-center rounded-full bg-neutral-900 text-white opacity-0 transition peer-checked:opacity-100" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" class="h-3 w-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
              </svg>
            </span>
          </label>

          <label class="relative block cursor-pointer">
            <input type="radio" name="role" value="planner" class="peer sr-only" />
            <div class="h-full rounded-2xl border border-neutral-200 bg-white p-4 pr-10 shadow-sm transition peer-checked:border-neutral-900 peer-checked:ring-4 peer-checked:ring-neutral-900/10 peer-focus-visible:ring-4 peer-focus-visible:ring-neutral-900/10 hover:border-neutral-300">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-neutral-100 text-neutral-700">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                  <path d="M8 6h13M8 12h13M8 18h13" />
                  <path d="M3 6h.01M3 12h.01M3 18h.01" />
                </svg>
              </span>
              <span class="mt-3 block text-sm font-semibold text-neutral-900">Planner / PMO</span>
              <span class="mt-1 block text-xs leading-relaxed text-neutral-500">Review matches, approve updates, watch delays.</span>
            </div>
            <span class="pointer-events-none absolute right-3 top-3 grid h-5 w-5 place-items-center rounded-full bg-neutral-900 text-white opacity-0 transition peer-checked:opacity-100" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" class="h-3 w-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
              </svg>
            </span>
          </label>

          <label class="relative block cursor-pointer">
            <input type="radio" name="role" value="lead" class="peer sr-only" />
            <div class="h-full rounded-2xl border border-neutral-200 bg-white p-4 pr-10 shadow-sm transition peer-checked:border-neutral-900 peer-checked:ring-4 peer-checked:ring-neutral-900/10 peer-focus-visible:ring-4 peer-focus-visible:ring-neutral-900/10 hover:border-neutral-300">
              <span class="grid h-10 w-10 place-items-center rounded-xl bg-neutral-100 text-neutral-700">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                  <path d="M3 3v18h18" />
                  <path d="m7 14 4-4 3 3 5-6" />
                </svg>
              </span>
              <span class="mt-3 block text-sm font-semibold text-neutral-900">Project Lead</span>
              <span class="mt-1 block text-xs leading-relaxed text-neutral-500">See confirmed progress and programme risk in one place.</span>
            </div>
            <span class="pointer-events-none absolute right-3 top-3 grid h-5 w-5 place-items-center rounded-full bg-neutral-900 text-white opacity-0 transition peer-checked:opacity-100" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" class="h-3 w-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
              </svg>
            </span>
          </label>

        </div>

        <div class="mt-8 flex items-center justify-between gap-4">
          <a href="project-reality-os-auth-signup.html" class="text-sm font-medium text-neutral-500 underline-offset-4 hover:text-neutral-900 hover:underline">
            Skip for now
          </a>
          <button
            type="submit"
            id="continue-btn"
            disabled
            class="rounded-xl bg-neutral-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-neutral-800 disabled:cursor-not-allowed disabled:bg-neutral-300 disabled:hover:bg-neutral-300"
          >
            Continue
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('role-form');
      var continueBtn = document.getElementById('continue-btn');
      var radios = Array.prototype.slice.call(form.querySelectorAll('input[name="role"]'));

      function syncContinue() {
        continueBtn.disabled = !radios.some(function (r) { return r.checked; });
      }

      radios.forEach(function (radio) {
        radio.addEventListener('change', syncContinue);
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var selected = form.querySelector('input[name="role"]:checked');
        if (!selected) return;
        var role = selected.value === 'lead' ? 'planner' : selected.value;
        try {
          localStorage.setItem('pros_role', role);
        } catch (err) {}
        window.location.href = 'project-reality-os-auth-signup.html';
      });

      syncContinue();
    })();
  </script>
</body>
</html>

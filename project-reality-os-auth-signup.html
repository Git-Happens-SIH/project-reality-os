<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Project Reality OS</title>
  <link rel="preload" href="assets/circle-loader.svg" as="image" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="pros-loader.js" defer></script>
</head>
<body>
  <div class="flex min-h-screen items-center justify-center bg-neutral-100 p-6">
    <div class="w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-8 shadow-sm">
      <h1 class="text-xl font-semibold text-neutral-900">Create your account</h1>
      <p class="mt-1 text-sm text-neutral-500">
        Already have one? <a href="project-reality-os-auth-chooser.html" class="font-medium text-neutral-900 hover:underline">Sign in</a>
      </p>
      <form id="signup-form" class="mt-6 space-y-4" action="project-reality-os-auth-otp.html" method="get">
        <input
          name="name"
          placeholder="Full name"
          required
          autocomplete="name"
          class="w-full rounded-xl border border-neutral-200 px-3.5 py-2.5 text-sm outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
        />
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email"
          required
          autocomplete="email"
          class="w-full rounded-xl border border-neutral-200 px-3.5 py-2.5 text-sm outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
        />
        <div>
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full rounded-xl border border-neutral-200 px-3.5 py-2.5 text-sm outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10"
          />
          <p class="mt-1.5 text-xs text-neutral-400">Use 8 or more characters with a mix of letters and numbers.</p>
        </div>
        <button type="submit" class="w-full rounded-xl bg-neutral-900 py-2.5 text-sm font-medium text-white transition hover:bg-neutral-800">
          Create account
        </button>
      </form>
      <p class="mt-6 text-center text-xs leading-relaxed text-neutral-400">
        By continuing you agree to our <a href="#" class="underline">Terms</a> and <a href="#" class="underline">Privacy Policy</a>.
      </p>
      <p class="mt-4 text-center text-xs text-neutral-400">
        <a href="project-reality-os-auth-reset.html" class="underline-offset-4 hover:text-neutral-700 hover:underline">Forgot password?</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      try {
        if (email) sessionStorage.setItem('pros_otp_email', email);
      } catch (err) {}
      window.location.href = 'project-reality-os-auth-otp.html';
    });
  </script>
</body>
</html>
